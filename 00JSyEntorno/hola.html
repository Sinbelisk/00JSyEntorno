<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Hola JS</title>
  </head>
  <body>
    <h1>Hola, mundo</h1>
    <script>
      console.log("¡Hola, mundo!");

      let nombre = "Rafael Francisco";
      let apellido = "Jiménez Rayo";

      let greet = `Bienvenido ${nombre} ${apellido}`;
      console.log(greet);

      document.body.innerHTML = `<h1>¡Hola, ${nombre}!</h1>`;
    </script>
  </body>
</html>
